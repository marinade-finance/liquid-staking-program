[package]
name = "cluster-profile"
version = "0.1.0"
edition = "2021"
description = "Snapshot and diff Solana cluster runtime profiles (features, sysvars, core programs)"
publish = false

# Own workspace: the parent tests/ workspace excludes this crate.
[workspace]

[[bin]]
name = "cluster-profile"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
