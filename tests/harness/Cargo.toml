[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-process LiteSVM harness for the Marinade liquid staking program"

[lib]
name = "harness"
path = "src/lib.rs"

[dependencies]
litesvm = { version = "=0.18.2", features = ["persistence-internal"] }
agave-feature-set = "~4.3.2"
solana-account = "4.3.0"
solana-address = "~2.7.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-instruction = "~3.5.0"
solana-hash = "~4.6.0"
solana-clock = "~3.2.0"
solana-epoch-schedule = "~3.3.0"
solana-rent = "~4.4.0"
solana-sysvar = "~4.2.0"
solana-stake-history = "1.0.0"
solana-stake-interface = { version = "~4.3.0", features = ["bincode"] }
solana-vote-interface = { version = "6.0.3", features = ["bincode"] }
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-sdk-ids = "3.1.0"
solana-transaction-error = "~3.4.0"
solana-native-token = "3.0.0"
solana-loader-v3-interface = "8.0.1"

marinade-finance = { path = "../../programs/marinade-finance", features = ["no-entrypoint"] }
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["stake", "mint", "token"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
bincode = "1.3"
bs58 = "0.5"
solana-pubkey = "4.3.0"
log = "0.4"

[dev-dependencies]
proptest = "1"
